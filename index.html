<script>
"use strict";
// Retroactive listener. Audio lives only in this page's memory; it leaves the
// phone only when a button is tapped, and only the tapped window.
const SR = 16000, RING_S = 120, CONV_S = 20, CLASS_S = 90;
const FLOOR = 0.35, CHAIN_S = 300, SILENT_DBFS = -55;
// gpt-4o-transcribe over -mini: on phone-mic replays it missed 17-22% of words vs 51-54% (tools/stt_bench/mic_check.py).
const STT_MODEL = "gpt-4o-transcribe";
const LLM = "claude-haiku-4-5-20251001";
const $ = id => document.getElementById(id);

const SYSTEM = `You are a retroactive listener inside a pair of smart glasses.
You receive a transcript of the last seconds of audio the wearer just heard.
It is mid-stream: it starts and ends abruptly, and ASR errors are common.

Emit exactly one reaction to what just happened. Pick the type this way:
- If the window contains a question put to the room, type is "answer" and you
  answer it. Commit to the answer. Do not reply with the question restated, do
  not list what the answer depends on, do not say what to consider. A wearer
  who is being asked something needs the answer, not the issue spotted.
- Only if no question was asked: type is "statement". Give the point worth
  having: the answer to the question the talk is circling, the takeaway, a
  correction, a name. Do not summarize the window back. If there is nothing
  worth adding (logistics, small talk), set confidence below 0.3. Never put a
  question in "short" or "long"; questions go only in "followups".
- Never invent figures, dates, or names. State a number only if you are sure
  of it; otherwise make the point without one.
- Answer the question actually asked. If the window holds several questions,
  answer the most recent one put to the wearer; earlier ones were already
  answered. If it has several parts, "long" takes them in the order asked, one
  sentence each. Never swap in a nearby question the notes happen to cover
  (asked about prompt architecture, do not answer with the tech stack).
- "short" and "long" are the wearer's own words, read aloud as written: first
  person, complete sentences, nothing left to fill in. Never coach ("Describe
  your process", "I'd walk through the SOP I used", "mention that...").

Rules: no preamble, no hedging, no restating the transcript. Assume the wearer
heard it. If the window is noise, chatter, or too fragmentary to react to, set
confidence below 0.3 and keep it brief. Confidence is your probability that
this reaction is worth interrupting the wearer for.

Reply with JSON only, fields in this order:
{"asked": true|false, "type":..., "confidence":..., "short":..., "long":...}
asked: was a question put to the room in this window? Decide this first.
short: one complete sentence, <=15 words, readable at a glance on a lens. If it is an answer, the
answer itself goes here, not a pointer to it.
long: <=60 words, the version with the reasoning in it.`;

// Appended to SYSTEM. Fields after "long", so the short answer still lands first.
const FOLLOW = `
After "long", add "followups": 2 or 3 questions the wearer could ask next, each
<=12 words, specific to what was just said (names, numbers, claims in the
window), never generic ("Can you elaborate?"). Order them best first.`;
const LENS = `
Behavioral-economics lens is ON. Before "followups", add "lens": <=25 words
naming the behavioral-economics or judgment concept actually at work in what
was said (anchoring, framing, loss aversion, sunk cost, social proof, default
effects, present bias, scarcity, availability, and so on), then one clause on
how it applies here. At least one follow-up should probe that mechanism.
Only name a concept when a speaker is actually deciding, pricing, persuading,
negotiating, predicting, or describing how people choose. Legal, factual, or
technical talk usually has none: then "lens" is "" and the follow-ups stay on
the substance. A stretched concept is worse than none.`;
const ASK = `You answer a follow-up question privately for the wearer of smart glasses.
You get the transcript they just heard and the question. Answer it directly and
commit; no preamble, no hedging. If the transcript does not settle it, answer
from general knowledge and say so in a few words.
Reply with JSON only: {"short": <=15 words, "long": <=60 words}`;
const useLens = () => $("lens").checked;
// The wearer's own notes (a project, a case, a meeting brief). Typed notes stay in localStorage;
// FINAL_PROJECT is baked into this public page, so it carries no name. Both ride along while ticked.
// One-tap preset for the final-project meeting. Plain-language on purpose: lead with what a
// number means, give one number, never a list of test statistics.
const FINAL_PROJECT = `Course: Music and the Brain. Final project, solo, podcast format (approved): about 8 minutes, MP3 or WAV, authors cited aloud, reference sheet separate. Due Nov 29.

Question: does the brain want music the same way it likes music? "Wanting" = the drive to go get a reward, tied to dopamine. "Liking" = the pleasure once you have it, tied to the brain's own opioids. In food research the two come apart; I'm asking whether they come apart for music.

Four sources (my four annotations):
1. Ferreri 2019 (PNAS, 27 people): a dopamine-boosting drug raised both how much people enjoyed songs and how much they'd pay for them; a dopamine blocker lowered both. So dopamine moves wanting and liking together in music.
2. Mas-Herrero 2023 (21 people): an opioid drug and an opioid blocker didn't change pleasure or chills. They only changed a body arousal signal (skin response). Whether opioids affect wanting was inconclusive.
3. Putkinen 2025 (PET scan, 15 women, their own playlists): the opioid system responds during music, and women with more chills showed a pattern the authors read as more opioid release. It's correlational, and the authors admit they can't tell if opioid activity went up or down overall.
4. Belfi 2022 (about 120 adults, ages 20-85): the drive to seek out new music drops with age, but chills, awe, and being moved don't. That's wanting dropping while liking holds.

My conclusion, stated carefully: the split is a working hypothesis, not a settled finding. The strongest piece is that novelty-seeking drops with age. Liking mostly holds, but not perfectly, and the two key results come from separate groups of people. One practical point: the standard cutoff for "musical anhedonia" (not getting pleasure from music) catches a lot more older adults, so it may need age-adjusted norms.

Honest limits: small samples in the drug studies; Belfi compares age groups at one point in time, so age and generation (growing up with streaming) can't be separated; the brain-scan link is correlational. One idea I'm keeping open: opioids may matter more for making music with other people than for listening alone.

Statistics, if asked: I went deep on the stats in my annotations, maybe more than needed. The plain version: the age drop in music-seeking is solid. The claim that liking stays flat is weaker, because it comes from a different group of people than the seeking result, which is why I call it a working hypothesis.

Scope: the project is a review of these published studies. It includes no data analysis of my own, so never mention a replication or reanalysis.`;

// GLO Law preset for stakeholder talks. Public facts only: this page is public, so nothing here
// that isn't already on glolaw.org, its connector listing or its served coverage notes.
// With it ticked, "short"/"long" are the plain answer and "tech" is the technical one.
const GLO_LAW = `GLO Law: what I built. My company, Eden Bound LLC, runs it.

WHAT IT IS. A free legal research library for people working the legal system without a lawyer (pro se), people in or coming out of prison, and the people who help them. Two ways in: the website, glolaw.org, and a connector (an MCP server at mcp.glolaw.org) that lets Claude, ChatGPT, Grok, Le Chat, Perplexity and Gemini CLI search it directly. Read-only: nothing can be written to it. Read calls work without signing in; the website uses Google sign-in, and GLO doesn't log searches. It is a research tool, not legal advice.
Plain version: think of it as a free law library an AI assistant can read from, that always tells you what it doesn't have.

WHY. For a pro se person in a high-stakes case, a confident wrong answer is the core harm, and commercial research tools are priced for law firms. So the design rule is that every answer says where it came from and how far its coverage reaches, and no caveat is ever stripped to sound more confident.

WHAT'S IN IT (each count is as of the snapshot date it carries).
- Case law: about 10.9 million opinion records (10,903,917) from CourtListener's bulk data, the Free Law Project's open archive, through September 30, 2026. About 8.75 million carry substantial text, about 2 million are short (many are one-line orders), and 1,798 are metadata only. It's a local mirror, not live CourtListener, so a case decided after that date isn't there.
- Statutes: about 2.1 million sections, all 50 states plus the U.S. Code, mostly from the open-us-law release of August 2026, with older Justia text filling gaps. They are point-in-time copies and never called current.
- Regulations: the federal Code of Federal Regulations (227,521 sections) and regulations from all 50 states, many only in part. Each state is its own source with its own quality-test result (clean, mixed or not clean), never blended with another.
- Corrections policies: the internal policies of 45 state departments of corrections, D.C., and the federal Bureau of Prisons, as the departments post them, some only in part. These are internal policies, not law, and GLO labels them that way.
- Cross-links: where a court opinion names a corrections policy or a regulation, GLO links the two both ways and shows the court's own sentence, with no ranking or summary.

WHAT IT DOES (17 tools). Find cases by name, by exact keyword, or by concept (meaning-based search over part of the collection); turn a citation into its case; read full opinions; see what an opinion cites and what cites it, with the citing court's own sentences; read later courts' one-line descriptions of a case; check negative history; check a whole brief; look up or search statutes and regulations; find opinions that cite a federal statute; look up corrections policies by number or keyword; count court deadlines (federal rules, Social Security appeals, Kansas court periods, Kansas corrections grievance limits) with every step shown beside the rule text; and read each source's coverage statement.

THE BRIEF CHECKER. Paste a document. It pulls out every citation with eyecite (the Free Law Project's citation parser), matches each one to a case in the mirror, and reports wherever a later court said that case was overruled, abrogated, superseded, reversed or vacated, quoting that court's sentence. It checks quoted language against the stored opinion text, because a made-up quote is a separate sanctions risk from a made-up case. It also scans for personal information court rules bar from public filings (Federal Rule of Civil Procedure 5.2 and Kansas Supreme Court Rule 24), showing every value masked, and it says which kinds of information it cannot detect. It never marks anything "cleared", and it doesn't store the document.
Plain version: it flags the citations and quotes you need to go read before you file; it never tells you you're safe.

NEGATIVE HISTORY, MEASURED. 97,561 court-reported negative links across 24,820 cases, built by machine from what later courts wrote. A guard declines the doubtful ones. On a blind hand-check of 145 links, 143 were right (about 98.6%). How many it misses has not been measured, so an empty result means nothing, and GLO says so.

WHAT IT NEVER DOES. No "good law" verdict, no green checkmark, no "verified" label, no positive or neutral signal anywhere. It is not Shepard's or KeyCite and doesn't claim to be. An empty result is never proof that something doesn't exist.

HOW I CHECK EVERYTHING IT SERVES.
1. Primary source only: every collection is a local copy of the government's or CourtListener's own bulk files, nothing pulled live from a third party.
2. Preregister: before a source is fetched, its pass/fail tests, sample size and text-extraction rules are frozen in a committed file; a rule changes only by a dated amendment written before the draw it governs.
3. Independent check: the loader is written in Node and the checker in Python, sharing no code; a seeded random sample is compared to the source bytes (sha256) and to a second government copy, and source drift is kept apart from loader errors. A failed test is reported as failed (Illinois came out mixed and was never re-scored).
4. Serve with limits: every answer carries a note and a coverage note naming its source, its as-of date and what it can't show; a broken route returns a visible error, never an empty result.
5. Canary the live text: automated checks read the actual served response, not the source code, because the two once differed by about 700 characters. They fail if a stated weakness disappears and also if padding creeps back in, and each check is proven by causing the failure on purpose.
6. Measure and correct: search quality is scored against a hand-labeled test set, and no ranking change ships without a measured gain. A known-limits ledger and a correction history are kept; one coverage figure was corrected four times, twice up and twice down, and overstating a weakness counts as an error just like understating one.
Rule of thumb: retrieve, never recall. A fact counts as verified only if it was fetched with a URL and a date.
Plain version: nothing goes out unless it was checked against the original, and every answer admits its gaps.

HOW IT'S BUILT (technical). PostgreSQL 16 holds the mirror, with BM25 keyword ranking (ParadeDB) and vector search (pgvector) over ModernBERT embeddings; a Node service sits in front of the database; the MCP server speaks Streamable HTTP; the website is Next.js on Vercel. Keyword search matches exact words with no stemming; concept search covers only the embedded part of the collection, and the two cover each other's gaps. I build it with AI coding agents (Claude) working under the rules above; I set the rules and make the calls.

WHERE IT CAME FROM. It grew out of Council, my multi-model deliberation app, where several AI models answer, a critic attacks the answer, and the weaknesses stay on screen. The same two rules carried over: never hide weaknesses, and never optimize for a "yes".

IF ASKED WHAT ISN'T HERE (users, revenue, funding, partners, prices, dates of future features): it isn't in these notes, so don't guess; say I'll follow up with the exact figure.`;
const GLO_FMT = `
GLO Law answers are ON. Right after "long", before any other field, add "tech": <=70 words, the
technical version of the same answer for an engineer, lawyer or researcher: name the method, the
data source and the measured number where the notes give one. "short" and "long" are then the
plain version for someone with no legal or technical background: everyday words, the meaning
before any number, at most one number. If the talk is not about GLO Law, "tech" is "".
Right after "asked", before "type", add "about": decide it before writing anything else.
"glo" = the most recent question asks about GLO Law itself (what it is, how it works, what is in
it, how it is checked). "job" = it asks how the wearer would do work for the listener (audit
their claims, build their workflow, run their research), even if it mentions GLO Law or the
wearer's resume. "other" = anything else.
If "job": "short" and "long" are the steps for the listener's job in their own field, taking the
parts in the order asked. Use no GLO Law facts, numbers or legal terms (cases, courts, overruled,
briefs) in them; at most one closing clause may name GLO Law as where the wearer has done similar
checking. "tech" is the technical version of those same steps.`;
const GLO_ASK = `
GLO Law answers are ON, so this replaces the reply format above. Reply with JSON only:
{"short": <=15 words, plain, "long": <=60 words, plain, "tech": <=70 words, the technical version
for an engineer, lawyer or researcher, naming the method, data source and measured number where
the notes give one}. Plain means everyday words, the meaning before any number, at most one number.`;
const useGlo = () => $("gloOn").checked;

function background() {
  const t = [$("fpOn").checked ? FINAL_PROJECT : "", $("bgOn").checked ? $("bg").value.trim() : ""].filter(Boolean).join("\n\n");
  return t ? `

The wearer wrote the background below about their own work. When the talk touches it, answer
as the wearer would say it out loud, in the first person, using these facts and numbers exactly
and never contradicting them. If the background doesn't cover the question, answer from general
knowledge and keep it consistent with the background, but never invent the wearer's own
history (tools, databases, employers, dates or numbers they used). If it asks how they did
something the background doesn't describe, answer with how they would do it ("I'd start
by..."), never "likely" or "probably". When the talk doesn't touch it, ignore it.
Say it the way a student talks to a professor: plain words, the meaning before the number, at
most one number per answer, no test names unless asked for them.
<background>
${t}
</background>` : "";
}
function gloBackground() {
  return useGlo() ? `

The wearer built GLO Law, described below, and is talking with people who may fund, partner with,
write about or use it. When the talk touches GLO Law, answer as the wearer would say it out loud,
in the first person, using these facts and numbers exactly and never contradicting them. Never call
any GLO answer "verified", "good law" or "court-ready". If the notes don't cover the question (users,
revenue, funding, partners, prices, future dates), don't guess and don't supply a number: say the
wearer will follow up with it. When the talk doesn't touch GLO Law, ignore these notes.
When the question is about doing work for the listener (their content, their workflow, their
milestone), answer that work first and use GLO Law in at most one sentence, as where the wearer
has done something like it. Never answer with a description of GLO Law instead.
<glo_law>
${GLO_LAW}
</glo_law>` : "";
}

const MODE_HINT = {
  conversation: "Mode: conversation, close-talk, two or more people. React as the thing the wearer would want to say next.",
  class: "Mode: long window: a lecture, or a long question in an interview or meeting. If the wearer or the room was asked something, answer the most recent question as the wearer would say it out loud. Otherwise surface the point worth writing down.",
};

// ---------- keys: arrive once via #k=<base64url json> from the laptop QR ----------
function loadKeys() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) {
    try {
      const j = JSON.parse(atob(m[1].replace(/-/g, "+").replace(/_/g, "/")));
      if (j.o && j.a) localStorage.setItem("halo.keys", JSON.stringify(j));
    } catch (e) {}
    history.replaceState(null, "", location.pathname);  // key never lingers in the URL
  }
  try { return JSON.parse(localStorage.getItem("halo.keys") || "null"); } catch (e) { return null; }
}
let KEYS = loadKeys();

// ---------- ring buffer: last RING_S seconds, int16, memory only ----------
const ring = new Int16Array(SR * RING_S);
let wpos = 0, filled = 0;
let total = 0;                 // absolute samples written since the page opened
let fSq = 0, fN = 0;           // current 200 ms frame, for the segmenter
function push(f32) {
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    ring[wpos] = s < 0 ? s * 32768 : s * 32767;
    wpos = (wpos + 1) % ring.length;
    total++; filled = Math.min(ring.length, filled + 1);
    fSq += s * s;
    if (++fN === FRAME) { const r = Math.sqrt(fSq / FRAME); fSq = 0; fN = 0; onFrame(r, total); }
  }
}
function pcmAt(a, b) {         // absolute sample range [a, b) out of the ring
  const n = b - a, out = new Int16Array(n);
  let p = ((wpos - (total - a)) % ring.length + ring.length) % ring.length;
  for (let i = 0; i < n; i++) { out[i] = ring[p]; p = (p + 1) % ring.length; }
  return out;
}
function tail(secs) {
  const n = Math.min(filled, Math.round(secs * SR));
  const out = new Int16Array(n);
  let p = (wpos - n + ring.length) % ring.length;
  for (let i = 0; i < n; i++) { out[i] = ring[p]; p = (p + 1) % ring.length; }
  return out;
}
function clearRing() { ring.fill(0); wpos = 0; filled = 0; resetSegs(); }
function dbfs(pcm) {
  let s = 0;
  for (let i = 0; i < pcm.length; i++) s += pcm[i] * pcm[i];
  return 20 * Math.log10(Math.sqrt(s / Math.max(1, pcm.length)) / 32768 + 1e-9);
}
function wav(pcm) {
  const b = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(b);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };

async function trigger(mode) {
  if (!stream) return;
  if (busy) { status("Still working on the last one."); return; }
  const secs = mode === "class" ? CLASS_S : CONV_S;
  const pcm = tail(secs);
  if (navigator.vibrate) navigator.vibrate(30);
  if (pcm.length < SR) { status("Not enough audio yet."); return; }
  if (dbfs(pcm) < SILENT_DBFS) { status("Nothing audible in that window."); return; }
  busy = true; setButtons();
  const t0 = performance.now();
  status((mode === "class" ? "Class" : "Conversation") + ": listening back " + Math.round(pcm.length / SR) + " s...");
  try {
    let text = null, how = "phone", later = null;
    try { text = await localTranscript(secs); } catch (e) { text = null; }
    if (!text) { ({ text, later } = await transcribe(pcm)); how = lastUpload; }   // cloud: fallback and when the phone heard nothing
    if (!text && later) { text = await later; later = null; }
    const tHeard = performance.now();
    if (!text) { status("Nothing audible in that window."); return; }
    const prior = (Date.now() - last.t) / 1000 < CHAIN_S ? last.text : null;
    const sec = x => ((x - t0) / 1000).toFixed(1);
    const answer = async (text, fixed) => {
      status((fixed ? "Transcript was cut off, re-reading: " : "Heard: ") + text.slice(0, 140) + (text.length > 140 ? "..." : ""));
      let tShort = 0;
      const r = await react(text, mode, prior, p => {
        if (p.confidence < FLOOR) return;
        tShort = performance.now();
        $("tag").textContent = p.type + " \u00b7 " + mode;
        $("short").textContent = p.short;
        $("long").textContent = ""; $("lensLine").textContent = ""; $("techLine").textContent = ""; $("follow").innerHTML = "";
        setWatch(p.short, p.type);
        if (navigator.vibrate) navigator.vibrate(fixed ? [20, 40, 20, 40, 20] : [40, 60, 40]);
      });
      last = { t: Date.now(), text };
      lastRun = { how, text, heard: (tHeard - t0) / 1000, short: r.short, conf: r.confidence, fixed: !!fixed,
                  lens: r.lens, followups: r.followups, done: (performance.now() - t0) / 1000 };
      logRun({ kind: "tap", mode, how, heard: text, fixed: !!fixed, prior: !!prior, conf: r.confidence, shown: r.confidence >= FLOOR,
               short: r.short, long: r.long, tech: r.tech, lens: r.lens, followups: r.followups,
               sec: { heard: +((tHeard - t0) / 1000).toFixed(1), short: tShort ? +((tShort - t0) / 1000).toFixed(1) : null,
                      done: +((performance.now() - t0) / 1000).toFixed(1) } });
      if (r.confidence < FLOOR) { status("Nothing worth saying about that one."); setWatch("Halo listening", "nothing worth saying"); return; }
      r.text = text; r.mode = mode;
      show(r, mode);
      status("answer at " + sec(tShort || performance.now()) + " s \u00b7 heard " + sec(tHeard) + " s (" + how + ")" +
             (fixed ? " \u00b7 corrected a cut-off transcript" : "") + " \u00b7 done " + sec(performance.now()) + " s");
      try { await navigator.clipboard.writeText(r.long + (r.tech ? "\n\nTechnical: " + r.tech : "")); } catch (e) {}
      if ($("speak").checked) say(r.short);
    };
    await answer(text, false);
    if (later) {
      const other = await Promise.race([later, new Promise(r => setTimeout(() => r(null), 6000))]);
      if (other && cutOff(text, other)) await answer(other, true);
    }
  } catch (e) {
    status(String(e.message || e), true);
  } finally {
    busy = false; setButtons();
  }
}

// ---------- UI ----------
function status(msg, err) { const s = $("status"); s.textContent = msg; s.className = err ? "err" : ""; }
function setButtons() { $("conv").disabled = $("cls").disabled = busy; }
function say(text) {
  try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); } catch (e) {}
}
function show(r, mode, replay) {
  lastReact = r;
  $("tag").textContent = r.type + " \u00b7 " + mode + (r.q ? " \u00b7 " + r.q : "");
  $("short").textContent = r.short;
  $("long").textContent = r.long;
  $("lensLine").textContent = r.lens ? "Lens: " + r.lens : "";
  $("techLine").textContent = r.tech ? "Technical: " + r.tech : "";
  const f = $("follow"); f.innerHTML = "";
  for (const q of r.followups || []) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = q;
    b.onclick = () => askFollow(q);
    f.appendChild(b);
  }
  $("copy").classList.remove("hide"); $("again").classList.remove("hide");
  // The answer, not the follow-ups, is what must be on screen.
  $("short").scrollIntoView({ block: "center" });
  const top = (r.followups || [])[0];
  setWatch(r.short, top ? "Ask: " + top : r.type);
  if (replay) return;
  session.unshift(r);
  const h = $("hist"); h.innerHTML = "";
  for (const x of session.slice(1, 10)) {
    const d = document.createElement("div"); d.textContent = x.short;
    d.onclick = () => show(x, "earlier", true);
    h.appendChild(d);
  }
  $("histCard").style.display = session.length > 1 ? "" : "none";
}

function render() {
  const ready = !!(KEYS && KEYS.o && KEYS.a);
  $("setup").classList.toggle("hide", ready);
  $("app").classList.toggle("hide", !ready);
  $("start").classList.toggle("hide", !ready || !!stream);
  $("triggers").classList.toggle("hide", !stream);
}

setInterval(() => {
  $("meter").firstElementChild.style.width = Math.max(0, Math.min(100, (level + 60) * 1.8)) + "%";
  $("buf").textContent = stream ? Math.floor(filled / SR) + " s" : "";
}, 150);

$("saveKeys").onclick = () => {
  const o = $("kOpen").value.trim(), a = $("kAnth").value.trim();
  if (!o || !a) return;
  KEYS = { o, a };
  localStorage.setItem("halo.keys", JSON.stringify(KEYS));
  render();
};
async function micHelp(e) {
  if (document.visibilityState !== "visible") return "The phone was locked. Unlock it and tap Start.";
  if (/; wv\)/.test(navigator.userAgent)) return "This opened inside another app. Open it in Chrome instead.";
  let perm = "unknown";
  try { perm = (await navigator.permissions.query({ name: "microphone" })).state; } catch (x) {}
  const name = e && e.name;
  if (perm === "denied") return "Microphone is blocked for Halo. In Chrome, tap the icon left of the address, then Permissions, Microphone, Allow. In the installed app, long-press the Halo icon, App info, Permissions, Microphone, Allow. Then tap Start.";
  if (name === "NotAllowedError") return "Android is blocking the microphone for Chrome. Open Settings, Apps, Chrome, Permissions, Microphone, and allow it while in use. Then tap Start.";
  if (name === "NotFoundError") return "No microphone found. If you use the SmartMike+, connect it to this phone first.";
  if (name === "NotReadableError") return "Another app is holding the microphone. Close it and tap Start.";
  return "Microphone failed: " + (e.message || e);
}
async function begin(auto) {
  try {
    await startAudio();
    if (ctx.state !== "running") throw Object.assign(new Error("Tap Start to begin."), { name: "NeedsTap" });
    armMediaButtons();
    keepAwake();
    render();
    status("Listening. Keep this screen open.");
  } catch (e) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    render();
    if (!auto) status(await micHelp(e), true);
  }
}
$("start").onclick = () => begin(false);
function autoStart() {
  if (stream || !KEYS || document.visibilityState !== "visible" || !navigator.permissions) return;
  navigator.permissions.query({ name: "microphone" })
    .then(p => { if (p.state === "granted") begin(true); }).catch(() => {});
}
document.addEventListener("visibilitychange", autoStart);
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("install").classList.remove("hide"); });
window.addEventListener("appinstalled", () => { $("install").classList.add("hide"); status("Installed. Open Halo from your home screen."); });
$("install").onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null;
  $("install").classList.add("hide");
};
$("conv").onclick = () => trigger("conversation");
$("cls").onclick = () => trigger("class");
$("mic").onchange = switchMic;
$("exportLog").onclick = async () => {
  const log = readLog();
  if (!log.length) { status("The log is empty."); return; }
  const json = JSON.stringify(log, null, 1);
  try { await navigator.clipboard.writeText(json); } catch (e) {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  a.download = "halo-log-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  status("Log copied and saved: " + log.length + " entries.");
};
$("clearLog").onclick = () => {
  if (!confirm("Clear the saved log on this phone?")) return;
  localStorage.removeItem(LOG_KEY); renderLogCount(); status("Log cleared.");
};
renderLogCount();
$("copy").onclick = () => lastReact && navigator.clipboard.writeText(lastReact.long + (lastReact.tech ? "\n\nTechnical: " + lastReact.tech : "")).then(() => status("Copied."));
$("again").onclick = () => lastReact && say(lastReact.short);
$("speak").checked = localStorage.getItem("halo.speak") === "1";
$("speak").onchange = e => localStorage.setItem("halo.speak", e.target.checked ? "1" : "0");
$("lens").checked = localStorage.getItem("halo.lens") === "1";
$("lens").onchange = e => localStorage.setItem("halo.lens", e.target.checked ? "1" : "0");
function renderBg() {
  const n = $("bg").value.trim().length;
  $("bgState").textContent = n ? "(" + n + " chars)" : "(empty)";
}
$("bg").value = localStorage.getItem("halo.bg") || "";
$("bgOn").checked = localStorage.getItem("halo.bgOn") === "1";
$("bg").oninput = () => { localStorage.setItem("halo.bg", $("bg").value); renderBg(); };
$("bgOn").onchange = e => localStorage.setItem("halo.bgOn", e.target.checked ? "1" : "0");
$("fpOn").checked = localStorage.getItem("halo.fpOn") === "1";
$("fpOn").onchange = e => localStorage.setItem("halo.fpOn", e.target.checked ? "1" : "0");
$("gloOn").checked = localStorage.getItem("halo.gloOn") === "1";
$("gloOn").onchange = e => localStorage.setItem("halo.gloOn", e.target.checked ? "1" : "0");
renderBg();
// Off by default: the model is a one-time 1.3 GB download; the cloud stays the default until the phone wins.
$("local").checked = localStorage.getItem("halo.local") === "1";
$("local").onchange = e => {
  localStorage.setItem("halo.local", e.target.checked ? "1" : "0");
  if (e.target.checked) startLocal();
};
window.addEventListener("pagehide", () => { clearRing(); });
window.haloDebug = () => ({ stt: sttState, note: sttNote, info: sttInfo, lastTap, total, segs: segs.length, pending: segs.filter(s => s.text === null).length, lastRun,
  pieces: segs.map(s => [+(s.start / SR).toFixed(1), +(s.end / SR).toFixed(1), s.id, s.failed ? "FAILED" : s.text, s.cost || null]) });
// Device tests: transcribe a Float32Array straight through the worker, bypassing the mic.
let rawId = 0;
window.haloSttRaw = (pcm, skip = 0, until = 0) => new Promise(res => {
  const id = -(++rawId), f = Float32Array.from(pcm);
  const h = e => { if (e.data.id === id) { stt.removeEventListener("message", h); res(e.data); } };
  stt.addEventListener("message", h);
  stt.postMessage({ kind: "seg", id, start: 0, end: f.length, pcm: f, skip, until }, [f.buffer]);
});

render();
// The whisper build's model cache is dead weight now that Parakeet replaced it.
try { caches.delete("transformers-cache"); } catch (e) {}
if ($("local").checked) startLocal();
autoStart();
if (navigator.serviceWorker) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
